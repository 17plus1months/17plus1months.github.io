<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sliding Memory · The Puzzle Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
</head>
<body class="game-slide">
<div class="game-wrap">

  <div class="top-line"><a class="back" href="index.html">← All puzzles</a></div>

  <h1 class="game-title">The Sliding Memory</h1>
  <p class="game-sub">
    Reconstruct some of my favorite moments with you by sliding tiles until the picture matches the goal.
    Either click a tile or use the arrow keys to rearrange the tiles. 
  </p>

  <div id="winBanner" class="win-banner">
    <div class="big">Picture restored!</div>
    <div class="sub" id="winSub"></div>
  </div>

  <div class="statbar">
    <span class="chip">Moves <b id="moves">0</b></span>
    <span class="chip">Time <b id="time">0:00</b></span>
  </div>

  <div class="board-row">
    <div id="board" class="slide-board" aria-label="sliding puzzle board"></div>
    <div class="preview">
      <img id="previewImg" alt="goal picture">
      <span>goal</span>
    </div>
  </div>

  <div class="controls">
    <select id="sizeSel" aria-label="board size">
      <option value="3">3 × 3 · easy</option>
      <option value="4" selected>4 × 4 · classic</option>
      <option value="5">5 × 5 · hard</option>
      <option value="6">6 × 6 · expert</option>
    </select>
    <label class="opt"><input type="checkbox" id="numsChk" checked> numbers</label>
    <button id="newBtn" class="primary" type="button">Shuffle</button>
  </div>

</div>

<!-- Puzzle photos come from the shared library (PHOTOS in js/gallery.js).
     Drop new pictures into images/gallery/ and add them to that list. -->
<script src="js/common.js"></script>
<script src="js/gallery.js"></script>
<script src="js/sliding.js"></script>
</body>
</html>
