<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141433"/><stop offset="1" stop-color="#33305e"/>
    </linearGradient>
    <pattern id="win" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="10" height="14" fill="#ffd166" opacity="0.85"/>
    </pattern>
    <mask id="moon">
      <circle cx="470" cy="120" r="46" fill="#fff"/>
      <circle cx="452" cy="106" r="38" fill="#000"/>
    </mask>
  </defs>
  <rect width="600" height="800" fill="url(#night)"/>
  <g fill="#ffffff">
    <circle cx="80" cy="90" r="2.5" opacity="0.8"/><circle cx="180" cy="60" r="2" opacity="0.6"/>
    <circle cx="300" cy="130" r="2.5" opacity="0.7"/><circle cx="540" cy="230" r="2" opacity="0.6"/>
    <circle cx="60" cy="220" r="2" opacity="0.5"/><circle cx="250" cy="230" r="2" opacity="0.55"/>
  </g>
  <rect width="600" height="800" fill="#f7ecd3" mask="url(#moon)"/>
  <g>
    <rect x="40" y="330" width="120" height="470" fill="#0e0e26"/>
    <rect x="40" y="330" width="120" height="470" fill="url(#win)"/>
    <rect x="190" y="260" width="140" height="540" fill="#131335"/>
    <rect x="190" y="260" width="140" height="540" fill="url(#win)"/>
    <rect x="360" y="380" width="110" height="420" fill="#0e0e26"/>
    <rect x="360" y="380" width="110" height="420" fill="url(#win)"/>
    <rect x="500" y="300" width="100" height="500" fill="#131335"/>
    <rect x="500" y="300" width="100" height="500" fill="url(#win)"/>
  </g>
  <line x1="260" y1="260" x2="260" y2="205" stroke="#131335" stroke-width="6"/>
  <circle cx="260" cy="200" r="5" fill="#ff6b6b"/>
</svg>
