<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2160"/>
      <stop offset="0.45" stop-color="#8d4a9e"/>
      <stop offset="0.72" stop-color="#e2607e"/>
      <stop offset="1" stop-color="#ffb35c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <circle cx="128" cy="112" r="40" fill="#fff"/>
      <circle cx="150" cy="100" r="34" fill="#000"/>
    </mask>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="60" r="3" opacity="0.9"/>
    <circle cx="210" cy="40" r="2" opacity="0.7"/>
    <circle cx="320" cy="90" r="2.5" opacity="0.8"/>
    <circle cx="420" cy="50" r="2" opacity="0.6"/>
    <circle cx="520" cy="110" r="3" opacity="0.85"/>
    <circle cx="640" cy="60" r="2" opacity="0.7"/>
    <circle cx="745" cy="130" r="2.5" opacity="0.8"/>
    <circle cx="180" cy="170" r="2" opacity="0.55"/>
    <circle cx="700" cy="220" r="2" opacity="0.5"/>
    <circle cx="60" cy="250" r="2" opacity="0.45"/>
  </g>

  <!-- crescent moon -->
  <rect width="800" height="800" fill="#f7ecd3" mask="url(#crescent)"/>

  <!-- heart balloon -->
  <path d="M645 218 q -8 46 6 88" stroke="#f7ecd3" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M645 150 c -14 -26 -52 -18 -52 12 c 0 24 30 40 52 56 c 22 -16 52 -32 52 -56 c 0 -30 -38 -38 -52 -12 z" fill="#ff6b8a"/>

  <!-- setting sun -->
  <circle cx="400" cy="600" r="230" fill="url(#glow)"/>
  <circle cx="400" cy="600" r="118" fill="#ffdf8e"/>

  <!-- birds -->
  <path d="M150 330 q 12 -12 24 0 q 12 -12 24 0" stroke="#3a2b57" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M230 300 q 10 -10 20 0 q 10 -10 20 0" stroke="#3a2b57" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- mountains -->
  <path d="M0 640 L110 500 L215 615 L330 505 L455 640 L570 520 L690 630 L800 545 L800 800 L0 800 Z" fill="#4a2f6e"/>
  <path d="M0 720 L150 585 L305 705 L470 600 L640 720 L800 640 L800 800 L0 800 Z" fill="#2e1d49"/>
</svg>
